name: Refresh market and fundamental data

on:
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
    steps:
      - name: Check provider credentials
        if: ${{ env.EODHD_API_TOKEN == '' }}
        run: echo 'EODHD_API_TOKEN is not configured; refresh skipped.'
      - name: Checkout
        if: ${{ env.EODHD_API_TOKEN != '' }}
        uses: actions/checkout@v4
      - name: Set up Python
        if: ${{ env.EODHD_API_TOKEN != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch EODHD data and calculate indicators
        if: ${{ env.EODHD_API_TOKEN != '' }}
        run: python scripts/ingest_eodhd.py
      - name: Commit refreshed dataset
        if: ${{ env.EODHD_API_TOKEN != '' }}
        run: |
          if git diff --quiet -- data/technical_screener.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/technical_screener.json
          git commit -m "Refresh market and fundamental data"
          git push
