name: Backtest Growth Momentum signal

on:
  push:
    paths:
      - "data/technical_screener.json"
      - "scripts/backtest_momentum_signal.py"
      - ".github/workflows/backtest-momentum.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 8 1 * *"

permissions:
  contents: write

concurrency:
  group: momentum-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Yahoo Finance client
        run: python -m pip install "yfinance>=0.2.54,<1"
      - name: Run point-in-time Momentum diagnostic
        run: python scripts/backtest_momentum_signal.py
      - name: Commit backtest summary
        run: |
          cp data/backtest_momentum.json /tmp/backtest_momentum.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/backtest_momentum.json data/backtest_momentum.json
            if [ -z "$(git status --porcelain -- data/backtest_momentum.json)" ]; then
              echo "No backtest summary changes."
              exit 0
            fi
            git add data/backtest_momentum.json
            git commit -m "Refresh Growth Momentum backtest summary"
            if git push; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); retrying from latest main."
            sleep 2
          done
          exit 1
