name: Refresh Yahoo Finance market data

on:
  push:
    paths:
      - "scripts/ingest_yahoo.py"
      - ".github/workflows/refresh-yahoo-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Yahoo Finance client
        run: python -m pip install "yfinance>=0.2.54,<1"
      - name: Refresh verified PEA instruments
        run: python scripts/ingest_yahoo.py
      - name: Commit refreshed dataset
        run: |
          cp data/technical_screener.json /tmp/technical_screener.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/technical_screener.json data/technical_screener.json
            if [ -z "$(git status --porcelain -- data/technical_screener.json)" ]; then
              echo "No data changes."
              exit 0
            fi
            git add data/technical_screener.json
            git commit -m "Refresh Yahoo Finance market data"
            if git push; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); retrying from latest main."
            sleep 2
          done
          exit 1
