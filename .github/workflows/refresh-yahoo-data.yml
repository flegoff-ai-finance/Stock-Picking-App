name: Refresh Yahoo Finance market data

on:
  push:
    paths:
      - "scripts/ingest_yahoo.py"
      - ".github/workflows/refresh-yahoo-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Yahoo Finance client
        run: python -m pip install "yfinance>=0.2.54,<1"
      - name: Refresh verified PEA instruments
        run: python scripts/ingest_yahoo.py
      - name: Commit refreshed dataset
        run: |
          if git diff --quiet -- data/technical_screener.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/technical_screener.json
          git commit -m "Refresh Yahoo Finance market data"
          git pull --rebase origin main
          git push
