name: Discover PEA equity candidates

on:
  push:
    paths:
      - "scripts/discover_pea_candidates.py"
      - ".github/workflows/discover-pea-candidates.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover France and Europe candidate lists
        run: python scripts/discover_pea_candidates.py
      - name: Commit candidate registry
        run: |
          if [ -z "$(git status --porcelain -- data/pea_candidates.json)" ]; then
            echo "No candidate changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pea_candidates.json
          git commit -m "Refresh PEA candidate discovery registry"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); retrying after fetching main."
            sleep 2
          done
          exit 1
