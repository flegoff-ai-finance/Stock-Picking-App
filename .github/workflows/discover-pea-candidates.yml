name: Discover PEA equity candidates

on:
  push:
    paths:
      - "scripts/discover_pea_candidates.py"
      - "scripts/build_pea_registry.py"
      - "data/pea_verification.csv"
      - ".github/workflows/discover-pea-candidates.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover France, Europe, EEA and MEQIRI candidate lists
        run: python scripts/discover_pea_candidates.py
      - name: Build strict eligibility audit
        run: python scripts/build_pea_registry.py
      - name: Commit candidate registry
        run: |
          cp data/pea_candidates.json /tmp/pea_candidates.json
          cp data/pea_registry_audit.json /tmp/pea_registry_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pea_candidates.json data/pea_candidates.json
            cp /tmp/pea_registry_audit.json data/pea_registry_audit.json
            if [ -z "$(git status --porcelain -- data/pea_candidates.json data/pea_registry_audit.json)" ]; then
              echo "No candidate changes."
              exit 0
            fi
            git add data/pea_candidates.json data/pea_registry_audit.json
            git commit -m "Refresh PEA candidate discovery registry"
            if git push; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); retrying from latest main."
            sleep 2
          done
          exit 1
