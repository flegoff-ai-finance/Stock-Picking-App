name: Validate data pipeline

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-data-pipeline.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-data-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile scripts/ingest_eodhd.py scripts/ingest_yahoo.py scripts/build_pea_registry.py scripts/sync_pea_registry.py scripts/backtest_momentum_signal.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
