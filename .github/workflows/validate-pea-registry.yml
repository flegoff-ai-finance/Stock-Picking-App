name: Validate PEA registry import

on:
  push:
    paths:
      - "data/pea_verification.csv"
      - "scripts/build_pea_registry.py"
      - ".github/workflows/validate-pea-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-pea-registry
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate broker-provided PEA evidence
        run: python scripts/build_pea_registry.py
      - name: Commit audit summary
        run: |
          cp data/pea_registry_audit.json /tmp/pea_registry_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pea_registry_audit.json data/pea_registry_audit.json
            if [ -z "$(git status --porcelain -- data/pea_registry_audit.json)" ]; then
              echo "No audit changes."
              exit 0
            fi
            git add data/pea_registry_audit.json
            git commit -m "Refresh PEA registry audit"
            if git push; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); retrying from latest main."
            sleep 2
          done
          exit 1
